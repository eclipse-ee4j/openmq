on:
  workflow_call:
    inputs:
      java_distribution:
        required: false
        type: string
        default: 'zulu'
      java_version:
        required: true
        type: string

jobs:
  build:
    name: Test on JDK ${{ inputs.java_version }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout for build
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: ${{ inputs.java_distribution }}
        java-version: ${{ inputs.java_version }}
    - name: Test Maven Build
      run: ./mvnw --show-version --no-transfer-progress --file mq/main install --define build.letter=g --define build.number=${GITHUB_REF_NAME}/${GITHUB_SHA}/${GITHUB_RUN_ID}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT} --define skipSBOM --define with:javah
    - name: Upload MQ Distribution
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        retention-days: 1
        path: mq/dist/bundles/mq.zip
        archive: false
    - name: Upload headers for native code
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: mq-native-headers
        retention-days: 1
        path: mq/main/**/target/javah/*.h
